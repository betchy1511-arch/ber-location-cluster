<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23071018'/><path d='M5 18L16 8l11 10v7H5z' fill='%23ffeb01'/></svg>">
<title>Big Easy Roofing, location cluster page prototypes</title>
<style>
html,body{margin:0;height:100%;background:#0a0a0a}
#stage{display:block;width:100%;height:100%;border:0}

.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}
</style>
</head>
<body>

<iframe id="stage" title="Prototype variant"></iframe>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item">Price Led</button>
  <button class="proto-picker-item">Local Authority</button>
  <button class="proto-picker-item" data-active aria-current="true">Cluster Console &#9733;</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">&#8635;</button>
</nav>

<script>
var files = ['variant-a.html', 'variant-b.html', 'variant-c.html'];

var stage = document.getElementById('stage');
var picker = document.querySelector('.proto-picker');
var highlight = picker.querySelector('.proto-picker-highlight');
var items = [].slice.call(picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)'));
var replay = picker.querySelector('.proto-picker-replay');
var current = 0;

function moveHighlight() {
  var el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}

function mount(i) {
  stage.src = files[i] + '?r=' + Date.now();
}

function setActive(i) {
  if (i < 0 || i >= files.length) return;
  current = i;
  items.forEach(function (el, j) {
    if (j === i) { el.setAttribute('data-active', ''); el.setAttribute('aria-current', 'true'); }
    else { el.removeAttribute('data-active'); el.removeAttribute('aria-current'); }
  });
  moveHighlight();
  var url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach(function (el, i) { el.addEventListener('click', function () { setActive(i); }); });
if (replay) replay.addEventListener('click', function () { mount(current); });
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', function (e) {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var num = parseInt(e.key, 10);
  if (num >= 1 && num <= files.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % files.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + files.length) % files.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 3) - 1);
requestAnimationFrame(function () {
  requestAnimationFrame(function () { picker.setAttribute('data-ready', ''); });
});
</script>
</body>
</html>
